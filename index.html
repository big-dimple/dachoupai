<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eadb" />
    <meta name="description" content="唐宋牌 · 唐宋人物题材的牌组构筑游戏" />
    <title>唐宋牌</title>
    <style>
      #resource-loading{position:fixed;inset:0;box-sizing:border-box;width:100%;height:100%;height:100dvh;max-width:none;max-height:none;margin:0;border:0;padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom));background:#f3eadb;color:#26313a;font:16px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;overflow:auto}
      #resource-loading::backdrop{background:#f3eadb}#resource-loading:not([open]){display:none}.load-wrap{width:min(100%,1040px);min-height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center;position:relative}.load-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #bfb19b;padding-bottom:15px;color:#59646a;font-size:12px;letter-spacing:.2em}.load-seal{writing-mode:vertical-rl;color:#b8473a;border:1px solid #b8473a;padding:7px 3px;font:16px Georgia,serif;letter-spacing:0}.load-scene{position:relative;min-height:300px;height:46vh;max-height:420px;display:flex;justify-content:center;align-items:center;isolation:isolate}.load-landscape{position:absolute;inset:5% 0;width:100%;height:90%;opacity:.58;z-index:-1}.load-brand{text-align:center;position:relative;transform:translateY(-20px)}.load-brand h1{margin:0;font:clamp(54px,8vw,96px)/1.2 Georgia,"Noto Serif SC",SimSun,serif;font-weight:bold;letter-spacing:.12em;text-shadow:1px 2px #fff9ee}.load-brand p{font-size:13px;letter-spacing:.24em;color:#3f606b}.load-fan{position:absolute;bottom:6px;left:50%;display:flex;gap:0;transform:translateX(-50%)}.load-card{width:54px;height:76px;background:#fff9ee;border:1px solid #9b927e;box-shadow:2px 3px 0 #26313a12;border-radius:5px;display:grid;place-items:center;font:30px Georgia,serif;animation:load-breathe 2.8s ease-in-out infinite;transform:rotate(-13deg)}.load-card:nth-child(2){color:#b8473a;transform:translateY(-8px);animation-delay:.2s}.load-card:nth-child(3){transform:rotate(13deg);animation-delay:.4s}.load-copy{max-width:600px;width:100%;margin:28px auto 0}.load-copy h2{margin:0 0 18px;font-size:18px;font-weight:500;text-align:center}.load-progress-line{display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:13px;color:#3f606b}.load-copy progress{display:block;width:100%;height:5px;margin:12px 0;accent-color:#b8473a;border:0;border-radius:4px;overflow:hidden;background:#d8ccba}.load-copy progress::-webkit-progress-bar{background:#d8ccba}.load-copy progress::-webkit-progress-value{background:#b8473a;transition:width .2s ease-out}.load-copy progress::-moz-progress-bar{background:#b8473a}.load-note{text-align:center;font-size:12px;color:#59646a;margin:22px 0}.load-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.load-actions button{min-height:44px;padding:10px 20px;border:1px solid #3f606b;border-radius:5px;color:#3f606b;background:#fff9ee;font:14px sans-serif;cursor:pointer}.load-actions button[data-load-retry]{background:#3f606b;color:#fff9ee}.load-actions button[hidden]{display:none}.load-footer{margin-top:32px;text-align:center;font-size:11px;letter-spacing:.08em;color:#7b7365}@keyframes load-breathe{50%{box-shadow:2px 9px 9px #26313a15}}@media(max-width:560px){#resource-loading{padding:20px}.load-scene{min-height:260px;height:43vh}.load-progress-line{font-size:12px}.load-copy{margin-top:14px}.load-brand h1{font-size:58px}.load-note{margin:16px 0}.load-footer{margin-top:20px}}@media(max-height:500px){.load-scene{height:180px;min-height:180px}.load-top{padding-bottom:8px}.load-brand h1{font-size:46px}.load-fan{display:none}.load-copy{margin-top:4px}.load-copy h2{margin-bottom:4px}.load-note,.load-footer{margin:8px 0}}@media(prefers-reduced-motion:reduce){.load-card{animation:none}.load-copy progress::-webkit-progress-value{transition:none}}
    </style>
  </head>
  <body>
    <dialog id="resource-loading" open aria-label="唐宋牌资源准备" aria-describedby="load-notice">
      <div class="load-wrap">
        <header class="load-top"><span>纸上山河 · 一局相逢</span><span class="load-seal" aria-hidden="true">开卷</span></header>
        <div class="load-scene" aria-hidden="true">
          <svg class="load-landscape" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid meet"><circle cx="758" cy="78" r="28" fill="#b8473a" opacity=".78"/><path d="M0 300 65 265 105 280 180 190 204 220 265 140 318 215 355 190 430 280 500 260 565 220 625 155 680 220 735 190 830 270 895 225 1000 305Z" fill="#3f606b" opacity=".13"/><path d="m0 315 85-28 55 12 75-55 48 29 42-17 80 50 65-9 80 15 70-46 48 18 64-40 72 44 50-10 94 30" fill="none" stroke="#3f606b" stroke-width="1.4"/><path d="m92 299 75-27m620 25 85-16M300 327q200-20 389 2m-290 14q154-7 241 0" fill="none" stroke="#7b7365" stroke-width=".8" opacity=".7"/></svg>
          <div class="load-brand"><h1>唐宋牌</h1><p>唐宋群英 · 牌局争锋</p></div>
          <div class="load-fan"><span class="load-card">♠</span><span class="load-card">♥</span><span class="load-card">♣</span></div>
        </div>
        <section class="load-copy"><h2 data-load-title>为你铺开这一局</h2><div class="load-progress-line"><span data-load-caption>正在打开牌局…</span><span data-load-counter aria-live="polite"></span></div><progress aria-label="已解码图片进度"></progress><p id="load-notice" class="load-note">先备好常用牌面，再从容入场。</p><div class="load-actions"><button data-load-retry hidden type="button">重试缺图</button><button data-load-next hidden type="button">先用文字牌面进入</button></div></section>
        <footer class="load-footer">人物形象待绘 · 六位英雄先以文字登场</footer>
      </div>
    </dialog>
    <noscript>请启用 JavaScript 以打开唐宋牌。</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
