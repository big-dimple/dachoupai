<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>唐宋牌 · 视听打击感 Phaser 运行环境</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg-dark: #0e171e;
      --panel-bg: #14212b;
      --accent-gold: #d0af72;
      --accent-red: #c24636;
      --accent-jade: #3fa382;
      --text-main: #f5eedf;
      --text-muted: #8b9ea8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 980px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #283e4d;
      padding-bottom: 8px;
    }
    h1 {
      font-size: 18px;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #233543;
      color: #9eb5c4;
      border: 1px solid #364e60;
    }
    #phaser-container {
      width: 960px;
      max-width: 100%;
      height: 520px;
      background: #13212b;
      border: 2px solid #283e4d;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .controls-panel {
      width: 100%;
      max-width: 960px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .row-label {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-gold);
      min-width: 80px;
    }
    button {
      background: #1c2c38;
      color: var(--text-main);
      border: 1px solid #3a5366;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      background: #283d4e;
      border-color: var(--accent-gold);
    }
    button.primary {
      background: #2e4d42;
      border-color: #4da688;
      color: #bffff0;
    }
    button.climax {
      background: #54221c;
      border-color: #c44f42;
      color: #ffd8d3;
    }
    button.active {
      background: var(--accent-gold);
      color: #1a160d;
      font-weight: bold;
      border-color: #ffd88a;
    }
    .status-bar {
      width: 100%;
      max-width: 960px;
      margin-top: 10px;
      background: #14212b;
      border: 1px solid #263845;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #log-line {
      color: #b2c9d6;
    }
    @media (max-width: 768px) {
      body { padding: 8px; }
      #phaser-container { height: 420px; }
      .row-label { min-width: 100%; margin-bottom: 2px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>唐宋牌 · 真实 Phaser 视听打击感验证环境</h1>
    <span class="badge">Phaser 3.88 + Web Audio + Spring Physics</span>
  </header>

  <div id="phaser-container"></div>

  <div class="controls-panel">
    <div class="btn-row">
      <span class="row-label">牌局手型:</span>
      <button id="btn-play-normal" class="primary">▶ 普通打出 (顺子/两对)</button>
      <button id="btn-play-interleaved" class="climax">✨ 交错加乘手 (含1.5倍率与英雄)</button>
      <button id="btn-play-mult" class="climax">💥 连乘爆点 (葫芦 + 战鼓)</button>
      <button id="btn-play-nomult">🃏 无倍率手 (高牌/平推)</button>
      <button id="btn-play-defeat">❌ 未通关手 (得分未达标)</button>
    </div>

    <div class="btn-row">
      <span class="row-label">六英技能:</span>
      <button id="btn-hero-sushi">苏轼 (助攻翻倍)</button>
      <button id="btn-hero-liue">刘娥 (顺延继承)</button>
      <button id="btn-hero-qinqiong">秦琼 (踏破押注)</button>
      <button id="btn-hero-xinqiji">辛弃疾 (挑灯补牌)</button>
      <button id="btn-hero-wencheng">文成 (迎宾充能)</button>
      <button id="btn-hero-huarui">花蕊 (凌风燃牌)</button>
    </div>

    <div class="btn-row">
      <span class="row-label">节奏控制:</span>
      <button id="btn-speed-1x" class="active">1× 正常节奏</button>
      <button id="btn-speed-4x">4× 极速快进</button>
      <button id="btn-cancel">⏸ 顿挫中取消</button>
      <button id="btn-replay">🔁 取消后立即重播</button>
      <button id="btn-reset">🔄 全量姿态物理复位</button>
    </div>

    <div class="btn-row">
      <span class="row-label">音乐低通:</span>
      <button id="btn-unlock-audio">🔓 触控激活音频链</button>
      <button id="btn-muffle-shop">🏪 进出商店 (深度 1)</button>
      <button id="btn-muffle-card">🔍 展开牌面弹窗 (深度 2)</button>
      <button id="btn-unmuffle-all">☀️ 全部退出恢复明亮</button>
      <button id="btn-mute-toggle">🔊 静音切换</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="log-line">运行环境加载就绪。点击或拖拽卡牌体验 2.5D 透视倾斜。</span>
    <span id="audio-status">音频线路: 正常 (SFX直连 / 音乐低通)</span>
  </div>

  <script type="module" src="./gamefeel-demo.ts"></script>
  <script>
    let currentSpeed = 1.0;
    const logEl = document.getElementById('log-line');
    const audioStatusEl = document.getElementById('audio-status');

    function log(msg) {
      if (logEl) logEl.textContent = msg;
    }

    function getState() {
      return window.__GAMEFEEL_STATE__;
    }

    // Playback buttons
    document.getElementById('btn-play-normal').onclick = () => {
      getState()?.playNormal(currentSpeed);
      log('打出普通两对手牌，触发 5 连发五音阶升调');
    };

    document.getElementById('btn-play-interleaved').onclick = () => {
      getState()?.playInterleaved(currentSpeed);
      log('打出交错加乘手牌 (含1.5小数倍率、加法与英雄收益)');
    };

    document.getElementById('btn-unlock-audio').onclick = async () => {
      await getState()?.unlockAudio();
      const running = getState()?.isAudioContextRunning();
      log(`真实触控解锁音频链: ${running ? '成功 (AudioContext RUNNING)' : '未就绪'}`);
      audioStatusEl.textContent = `音频上下文: ${running ? 'RUNNING' : 'SUSPENDED'}`;
    };

    document.getElementById('btn-play-mult').onclick = () => {
      getState()?.playHighMult(currentSpeed);
      log('打出高倍率牌型，触发 50ms 顿挫冻结与唐风战鼓爆点');
    };

    document.getElementById('btn-play-nomult').onclick = () => {
      getState()?.playNoMult(currentSpeed);
      log('打出无额外倍率手，平滑进入收束，不虚构 ×2 爆点');
    };

    document.getElementById('btn-play-defeat').onclick = () => {
      getState()?.playDefeat(currentSpeed);
      log('打出未达标手牌，收束时不播放大捷编钟');
    };

    // Hero skill buttons
    document.getElementById('btn-hero-sushi').onclick = () => {
      getState()?.playHeroSkill('sushi', currentSpeed);
      log('打出苏轼助攻手牌，触发风起赤壁专属收益');
    };
    document.getElementById('btn-hero-liue').onclick = () => {
      getState()?.playHeroSkill('liue', currentSpeed);
      log('打出刘娥顺延手牌，触发大宋之母收益');
    };
    document.getElementById('btn-hero-qinqiong').onclick = () => {
      getState()?.playHeroSkill('qinqiong', currentSpeed);
      log('打出秦琼踏破山河押注手牌');
    };
    document.getElementById('btn-hero-xinqiji').onclick = () => {
      getState()?.playHeroSkill('xinqiji', currentSpeed);
      log('打出辛弃疾挑灯看剑补牌手');
    };
    document.getElementById('btn-hero-wencheng').onclick = () => {
      getState()?.playHeroSkill('wencheng', currentSpeed);
      log('打出文成公主迎宾充能手');
    };
    document.getElementById('btn-hero-huarui').onclick = () => {
      getState()?.playHeroSkill('huarui', currentSpeed);
      log('打出花蕊夫人凌风燃牌手');
    };

    // Speed controls
    const btn1x = document.getElementById('btn-speed-1x');
    const btn4x = document.getElementById('btn-speed-4x');

    btn1x.onclick = () => {
      currentSpeed = 1.0;
      btn1x.classList.add('active');
      btn4x.classList.remove('active');
      log('播放速率切换为 1× 正常节奏');
    };

    btn4x.onclick = () => {
      currentSpeed = 4.0;
      btn4x.classList.add('active');
      btn1x.classList.remove('active');
      log('播放速率切换为 4× 极速加速 (弹簧与音频衰减同步提速)');
    };

    // Cancellation and replay
    document.getElementById('btn-cancel').onclick = () => {
      getState()?.cancel();
      log('演出已立即中断，卡牌姿态干净复位，旧回调已注销');
    };

    document.getElementById('btn-replay').onclick = () => {
      getState()?.cancel();
      setTimeout(() => {
        getState()?.playHighMult(currentSpeed);
        log('取消后立即开启新一手高倍率结算');
      }, 50);
    };

    // Reset button (no missing method crashes!)
    document.getElementById('btn-reset').onclick = () => {
      getState()?.reset();
      log('卡牌姿态与弹簧物理已全量复位到基准平面');
    };

    // Lowpass filter toggles
    let shopOpen = false;
    let cardDetailOpen = false;

    document.getElementById('btn-muffle-shop').onclick = () => {
      shopOpen = !shopOpen;
      getState()?.toggleMuffle('shop', shopOpen);
      const m = getState()?.getReadout().isMuffled;
      log(`商店弹层 ${shopOpen ? '进入 (深度+1)' : '退出 (深度-1)'}，低通滤镜: ${m ? '沉闷 450Hz' : '清晰 20kHz'}`);
      audioStatusEl.textContent = `音乐低通: ${m ? '滤闷生效 (深度 ' + getState()?.getReadout().stackDepth + ')' : '全频明亮'}`;
    };

    document.getElementById('btn-muffle-card').onclick = () => {
      cardDetailOpen = !cardDetailOpen;
      getState()?.toggleMuffle('card-detail', cardDetailOpen);
      const m = getState()?.getReadout().isMuffled;
      log(`卡牌详情嵌套层 ${cardDetailOpen ? '进入 (深度+1)' : '退出 (深度-1)'}，低通滤镜: ${m ? '沉闷 450Hz' : '清晰 20kHz'}`);
      audioStatusEl.textContent = `音乐低通: ${m ? '滤闷生效 (深度 ' + getState()?.getReadout().stackDepth + ')' : '全频明亮'}`;
    };

    document.getElementById('btn-unmuffle-all').onclick = () => {
      shopOpen = false;
      cardDetailOpen = false;
      getState()?.filterTransition.reset();
      log('所有弹层已退出，音乐线路完全恢复 20kHz 明亮透彻');
      audioStatusEl.textContent = '音乐低通: 全频明亮';
    };

    // Mute toggle
    document.getElementById('btn-mute-toggle').onclick = () => {
      const audio = getState()?.audioEngine;
      if (audio) {
        audio.muted = !audio.muted;
        log(`静音切换: ${audio.muted ? '已静音' : '已解除静音'}`);
        audioStatusEl.textContent = `音频状态: ${audio.muted ? '静音' : '正常'}`;
      }
    };
  </script>
</body>
</html>
