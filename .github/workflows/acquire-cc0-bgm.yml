name: Acquire authorized CC0 transition BGM
on:
  push:
    branches: [assets/bgm-cc0-acquire-20261009]
    paths: [.github/workflows/acquire-cc0-bgm.yml]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the author-published original and attribution page
        run: |
          mkdir bgm
          curl --fail --location --max-time 40 https://opengameart.org/sites/default/files/dark_things_loop_0.mp3 -o bgm/dark-things-loop.mp3
          curl --fail --location --max-time 30 https://opengameart.org/content/dark-things-loop -o bgm/author-page.html
          sha256sum bgm/dark-things-loop.mp3
          wc -c bgm/dark-things-loop.mp3
      - name: Preserve the exact acquired original on this isolated asset branch
        run: |
          mkdir -p public/assets/audio/transition-bgm
          cp bgm/dark-things-loop.mp3 public/assets/audio/transition-bgm/dark-things-loop.mp3
          cp bgm/author-page.html public/assets/audio/transition-bgm/author-page.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/assets/audio/transition-bgm/dark-things-loop.mp3 public/assets/audio/transition-bgm/author-page.html
          git commit -m 'assets: preserve author-published CC0 Dark Things Loop'
          git push origin HEAD:assets/bgm-cc0-acquire-20261009
      - uses: actions/upload-artifact@v4
        with:
          name: authorized-cc0-dark-things-loop
          path: bgm
          retention-days: 3
